# 一時的な検証用ワークフロー（Node 更新 PR のビルド確認のためだけに追加。マージ前に削除する）
name: tmp-verify-node
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node -v
      - run: npx -y pnpm@8 install --frozen-lockfile
      - run: npx -y pnpm@8 run build
